id: sap_b1_supplier_statement
name: SAP Business One — Supplier Statement
description: >
  Crystal Reports "Collection Report" export from SAP Business One.
  Line items wrap the BP Ref. No. column when the reference overflows the
  fixed column width.

# --------------------------------------------------------------------------
# Detection: cheap signals scored 0..1. `require` phrases are hard gates.
# --------------------------------------------------------------------------
detect:
  require:
    - "Supplier Statement"
  text_contains:
    - "Supplier Statement"
    - "Ageing Date"
    - "BP Ref. No."
    - "Prior Period Balance"
  pdf_metadata:
    Creator: "crystal"

# --------------------------------------------------------------------------
# Header metadata, captured by regex from the text above the table.
# --------------------------------------------------------------------------
metadata:
  supplier_code:
    pattern: 'BP:\s*From\s+(\S+)'
    type: text
  supplier_name:
    # Crystal renders the BP code on the same visual line as the name.
    # Suffix may be parenthesised: "NAZIH TRADING CO.(LLC)".
    pattern: '^([A-Z0-9][A-Z0-9 .,&\-]{4,}(?:\(?(?:L\.L\.C\.|LLC|FZE|LTD|LIMITED)\)?|CO\.?\s*\(?(?:L\.L\.C\.|LLC)?\)?))\.?$'
    type: text
    strip_prefix_field: supplier_code
  currency:
    pattern: 'Currency:\s*([A-Z]{3})'
    type: text
  ageing_date:
    pattern: 'Ageing Date:\s*([\d.]+)'
    type: date
    format: DMY_DOT
  statement_to_date:
    pattern: 'Posting Date:\s*From\s*To\s*([\d.]+)'
    type: date
    format: DMY_DOT
  phone:
    # extract_metadata strips space before ':' and '#', so "Phone #:" arrives
    # as "Phone#:". \s* matches either form.
    pattern: 'Phone\s*#:\s*(\+?[\d ]+)'
    type: text
  credit_limit:
    pattern: 'Credit Limit:\s*([\d,.]+)'
    type: decimal
  commitment_limit:
    pattern: 'Commitment Limit:\s*([\d,.]+)'
    type: decimal

# --------------------------------------------------------------------------
# Table geometry. Column labels must match the header line verbatim --
# probe_layout will show you exactly what it reads.
# --------------------------------------------------------------------------
table:
  columns:
    - "Document"
    - "BP Ref. No."
    - "Post. Date"
    - "Due Date"
    - "Details"
    - "Amount"
    - "Balance"
  anchor_column: "Document"
  # "PU 131365" -- document type token plus internal number.
  anchor_pattern: '^[A-Z]{2,3}\s+\d+$'
  stop_pattern: '^Total\b'
  # "" joins wrapped fragments tightly: report wrapping breaks mid-token
  # ("SI/08781/CN/" + "00007"). Use " " for prose columns like addresses.
  join_with: ""

fields:
  - {name: document_type,   source: "Document",    type: token, index: 0}
  - {name: document_no,     source: "Document",    type: token, index: 1}
  - {name: bp_reference_no, source: "BP Ref. No.", type: text}
  - {name: posting_date,    source: "Post. Date",  type: date, format: DMY_DOT}
  - {name: due_date,        source: "Due Date",    type: date, format: DMY_DOT}
  - {name: details,         source: "Details",     type: text}
  - {name: amount,          source: "Amount",      type: decimal}
  - {name: running_balance, source: "Balance",     type: decimal}

# --------------------------------------------------------------------------
# Ageing block. Values are right-aligned under their headers.
# --------------------------------------------------------------------------
summary:
  columns:
    - "Balance Due"
    - "Future Remit"
    - "0 - 30"
    - "31 - 60"
    - "61 - 90"
    - "91 - 120"
    - "121+"
  min_hits: 4
  scan_lines: 6
  rows:
    - {name: buckets,     match: '^Total\b'}
    - {name: percentages, match: '^Ageing\b', value_pattern: '^[\d.]+$'}

# --------------------------------------------------------------------------
# Cross-checks. These decide whether the document is safe to auto-post.
# --------------------------------------------------------------------------
validation:
  # Localises a fault to a single line rather than only saying the
  # document does not foot. Also catches reordered or duplicated rows.
  - type: running_balance_chain
    amount_field: amount
    balance_field: running_balance
    opening_balance: 0.0
    tolerance: 0.01
  - type: sum_equals_last
    sum_field: amount
    equals_field: running_balance
    tolerance: 0.01
  - type: summary_equals_last
    summary_row: buckets
    summary_column: "Balance Due"
    equals_field: running_balance
    tolerance: 0.01
  - type: required_fields
    fields: [document_no, bp_reference_no, amount, posting_date]
  # A reference that came back as a bare wrap fragment would still
  # cross-foot; a shape check catches it.
  - type: field_matches
    field: bp_reference_no
    pattern: '^[A-Za-z0-9][A-Za-z0-9/\\-]{3,}$'
