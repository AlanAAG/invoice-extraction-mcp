# Lead dev quickstart:
#   cp .env.example .env && edit DOC_EXTRACT_TOKEN
#   docker compose up --build
#   python scripts/smoke_test.py http://localhost:8000 $DOC_EXTRACT_TOKEN
services:
  doc-extract:
    build: .
    ports:
      - "8000:8000"
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
      LOG_LEVEL: INFO
      # Never commit a real value. Injected by the platform in deployed envs.
      DOC_EXTRACT_TOKEN: ${DOC_EXTRACT_TOKEN:?set DOC_EXTRACT_TOKEN in .env}
    # Profiles are config, not code: mount them to add a vendor format and
    # POST /admin/reload-profiles without rebuilding the image.
    volumes:
      - ./profiles:/app/profiles:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
